name: Prepare Screen Analysis Branch

on:
  push:
    branches:
      - feat/58-screen-spec-from-screenshot

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Format sources
        run: bun run format

      - name: Regenerate docs
        run: bun run docs

      - name: Commit generated preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json src/image .changeset README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare screen image analysis"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Changeset status
        run: bun run changeset:status
