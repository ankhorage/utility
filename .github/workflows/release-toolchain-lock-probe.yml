name: Release toolchain lock probe

on:
  pull_request:
    paths:
      - '.github/workflows/release-toolchain-lock-probe.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve release toolchain lock
        run: |
          bun install --lockfile-only
          grep -F '"@ankhorage/devtools": ["@ankhorage/devtools@1.21.3"' bun.lock
          grep -F '"@ankhorage/paradox": ["@ankhorage/paradox@0.2.3"' bun.lock
          git diff -- bun.lock
